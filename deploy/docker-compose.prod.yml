# Produção (hostinger-vps): só publica em 127.0.0.1:8099, atrás do nginx do Hestia.
# Banco, uploads e .env.local continuam em web/agathas.com.br/private. user 1006 = agweb, dono deles.
# /uploads é servido direto pelo nginx: next start só enxerga o public/ existente no boot.
name: agathas-prod

secrets:
  env:
    file: /home/agweb/web/agathas.com.br/private/.env.local

services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      additional_contexts:
        dados: ../.snap
        uploads: /home/agweb/web/agathas.com.br/private/public/uploads
      secrets: [env]
    image: agathas-prod-web
    container_name: agathas-prod-web
    restart: unless-stopped
    ports: ["127.0.0.1:8099:3000"]
    # Formato raw: o Compose expandiria o $ da chave do ASAAS e a deixaria vazia. Gerado pelo publicar.sh.
    env_file:
      - path: .env.runtime
        format: raw
    volumes:
      - "${AG_DATA:-/home/agweb/web/agathas.com.br/private/data}:/app/data"
      - "${AG_UPLOADS:-/home/agweb/web/agathas.com.br/private/public/uploads}:/app/public/uploads"
    mem_limit: 1536m
    # Envia os leads ao YESHUA por dentro da VPS (YESHUA_LEADS_URL=http://yeshua-next-proxy/api/leads/site): em
    # 18/11/2026 a VPS deixou de alcançar por IPv4 os endereços da Cloudflare do yeshua.agathasweb.com e os
    # leads do site paravam aqui, sem chegar ao YESHUA.
    networks: [default, yeshua]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/',{redirect:'manual'}).then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s

networks:
  yeshua:
    name: yeshua-next-prod_yeshua-prod
    external: true
